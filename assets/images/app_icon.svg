  <path
    d="M100 58 C76 58 57 77 57 101 C57 131 100 152 100 152 C100 152 143 131 143 101 C143 77 124 58 100 58 Z"
    fill="#FFFFFF"
  />
  <circle cx="100" cy="101" r="19" fill="#E8A33D"/>
</svg>

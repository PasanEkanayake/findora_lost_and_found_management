org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# Workaround for a current Flutter/Kotlin ecosystem bug: several plugins
# (firebase_core, geocoding, image_picker, google_maps_flutter, and many
# others) still apply their own Kotlin Gradle Plugin instead of using
# AGP 9's new built-in Kotlin support, which is failing under this
# toolchain combination with "Could not close incremental caches" /
# BuildToolsApiCompilationWork errors. Disabling incremental Kotlin
# compilation avoids the buggy code path entirely (slightly slower
# rebuilds, otherwise no effect). Tracking: flutter/flutter#173456,
# flutter/flutter#187225, flutter/flutter#185121.
kotlin.incremental=false

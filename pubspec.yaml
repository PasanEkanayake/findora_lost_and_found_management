name: findora
description: >
  Findora — a Flutter app for reporting, browsing, and matching lost &
  found items using on-device AI image recognition and a Supabase backend.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

# NOTE ON VERSIONS
# These have been bumped to the newer majors available as of this check
# (flutter_riverpod 3.x, go_router 18.x, flutter_local_notifications 22.x,
# geocoding 5.x, and others). Three required source changes to keep working,
# all already applied in this codebase:
#   - geocoding 5.x replaced the top-level placemarkFromCoordinates()
#     function with an instance method (Geocoding().placemarkFromCoordinates)
#     — see post_item_screen.dart.
#   - flutter_local_notifications 22.x requires core library desugaring,
#     Java 17, and minSdk 24+ on Android — see android/app/build.gradle.kts
#     and README.md's "Troubleshooting Gradle errors" section.
#   - flutter_local_notifications 22.x also changed initialize() and show()
#     to take named parameters (settings:, id:/title:/body:/notificationDetails:)
#     instead of positional ones — see core/notifications/push_notifications.dart.
#   - RadioListTile.groupValue/onChanged are deprecated in favor of a
#     RadioGroup ancestor widget (Flutter 3.35+) — see item_detail_screen.dart.
# The TFLite entry still needs a manual check — see README.md.
dependencies:
  flutter:
    sdk: flutter

  # --- Backend --------------------------------------------------------------
  supabase_flutter: ^2.17.2

  # --- State management & navigation ----------------------------------------
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1

  # --- UI ---------------------------------------------------------------------
  google_fonts: ^8.2.1
  cached_network_image: ^4.0.0
  shimmer: ^4.0.0
  # Used for the "Contact support" mailto: link in Help & Support.
  url_launcher: ^6.3.2

  # --- Media & on-device ML ---------------------------------------------------
  image_picker: ^1.1.2
  image: ^4.2.0
  # tflite_flutter's upstream repo has been slow-moving — verify the current
  # best-maintained package on pub.dev before running `flutter pub get`
  # (search "tflite" on pub.dev or fluttergems.dev and sort by "last updated").
  tflite_flutter: ^0.12.1

  # --- Location -----------------------------------------------------------
  geolocator: ^14.0.3
  geocoding: ^5.0.0
  google_maps_flutter: ^2.9.0

  # --- Notifications --------------------------------------------------------
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  flutter_local_notifications: ^22.3.0

  # --- Utilities ------------------------------------------------------------
  flutter_dotenv: ^6.0.1
  intl: ^0.20.3
  uuid: ^4.5.1
  cupertino_icons: ^1.0.8
  # Used only to remember whether the onboarding carousel has been seen.
  shared_preferences: ^2.5.4
  # Used only by TextEmbeddingService to call the optional ai_service/
  # microservice — see that class's doc for why it's fully optional.
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/models/
    - assets/images/

# Run `dart run flutter_launcher_icons` — the PNGs it needs already exist
# in assets/images/ (see README.md, "App icon and branding").
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"

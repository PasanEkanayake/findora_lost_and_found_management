name: findora
description: >
  Findora — a Flutter app for reporting, browsing, and matching lost &
  found items using on-device AI image recognition and a Supabase backend.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

# NOTE ON VERSIONS
# These were current as of research done alongside this scaffold (Sept 2026)
# but the Flutter/Dart package ecosystem moves fast. Before your first
# `flutter pub get`, run `flutter pub outdated` and bump anything stale.
# The TFLite entry in particular needs a manual check — see README.md.
dependencies:
  flutter:
    sdk: flutter

  # --- Backend --------------------------------------------------------------
  supabase_flutter: ^2.17.2

  # --- State management & navigation ----------------------------------------
  flutter_riverpod: ^2.6.1
  go_router: ^16.0.0

  # --- UI ---------------------------------------------------------------------
  google_fonts: ^6.2.1
  flutter_svg: ^2.2.3
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  # --- Media & on-device ML ---------------------------------------------------
  image_picker: ^1.1.2
  image: ^4.2.0
  # tflite_flutter's upstream repo has been slow-moving — verify the current
  # best-maintained package on pub.dev before running `flutter pub get`
  # (search "tflite" on pub.dev or fluttergems.dev and sort by "last updated").
  tflite_flutter: ^0.11.0

  # --- Location -----------------------------------------------------------
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  google_maps_flutter: ^2.9.0

  # --- Notifications --------------------------------------------------------
  firebase_core: ^3.4.0
  firebase_messaging: ^15.1.0
  flutter_local_notifications: ^17.2.2

  # --- Utilities ------------------------------------------------------------
  flutter_dotenv: ^5.2.1
  intl: ^0.19.0
  uuid: ^4.5.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/models/
    - assets/images/

# Run `dart run flutter_launcher_icons` — the PNGs it needs already exist
# in assets/images/ (see README.md, "App icon and branding").
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0F6E56"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"
